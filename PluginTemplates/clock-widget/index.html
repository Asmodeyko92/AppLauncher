<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f8f9ff; font-family: "Segoe UI Variable", "Segoe UI", sans-serif; background: radial-gradient(circle at 20% 15%, #796aff66, transparent 45%), linear-gradient(145deg, #20263b, #10131e 75%); }
  main { text-align: center; padding: 12px; }
  #time { font-size: clamp(32px, 15vw, 72px); font-weight: 650; letter-spacing: -0.07em; line-height: .95; text-shadow: 0 8px 28px #0008; }
  #seconds { color: #9d93ff; font-size: .45em; vertical-align: .22em; margin-left: .12em; }
  #date { margin-top: 12px; color: #c9cce0; font-size: clamp(11px, 4vw, 16px); text-transform: capitalize; }
  #zone { margin-top: 7px; color: #8b90ac; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
</style>
</head>
<body><main><div id="time">--:--<span id="seconds">--</span></div><div id="date"></div><div id="zone"></div></main>
<script>
  const time = document.querySelector('#time'), seconds = document.querySelector('#seconds'), date = document.querySelector('#date'), zone = document.querySelector('#zone');
  const tick = () => {
    const now = new Date();
    time.firstChild.nodeValue = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    seconds.textContent = now.toLocaleTimeString([], { second: '2-digit' });
    date.textContent = now.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
    zone.textContent = Intl.DateTimeFormat().resolvedOptions().timeZone.replace('_', ' ');
  };
  tick(); setInterval(tick, 1000);
</script></body></html>
